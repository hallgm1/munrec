<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Agro Municipal POS</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #232f3e; display: flex; justify-content: center; padding: 20px; }
        .form-container { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { border: none; color: white; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 10px; }
        .btn-print { background: #2ecc71; }

        /* Receipt Printing Styles */
        #receipt-print { display: none; }
        
        @media print {
            body { background: white; padding: 0; }
            .form-container { display: none; }
            #receipt-print { 
                display: block; 
                width: 58mm; 
                font-family: 'Courier New', Courier, monospace; 
                font-size: 12px; 
                line-height: 1.3;
                /* Requirement 1: Increase length by 50% */
                padding-bottom: 40mm; 
                color: black;
            }
            /* Requirement 2: Spaced Dotted Lines */
            .dotted-divider {
                height: 2px;
                background-image: linear-gradient(to right, black 33%, rgba(255,255,255,0) 0%);
                background-position: bottom;
                background-size: 6px 1px; /* Adjust 6px to increase/decrease space between dots */
                background-repeat: repeat-x;
                margin: 8px 0;
            }
            .center { text-align: center; }
            .bold { font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <label>Business Name</label>
    <input type="text" id="bizName" value="METRO AGRO MACHINERY & SPARES LTD">
    <label>Customer Name</label>
    <input type="text" id="custName" value="WILLIAM MATHAYO GENDO">
    <label>Total Amount (TZS)</label>
    <input type="number" id="totalAmt" value="30000">
    <label>Receipt No.</label>
    <input type="text" id="rcptNo" value="1421102411123">

    <button class="btn btn-print" onclick="generateAndPrint()">PRINT RECEIPT</button>
</div>

<div id="receipt-print">
    <div class="center">
        Halmashauri ya Jiji la Dar es Salaam<br>
        Receipt No: <span id="p-no"></span>
    </div>
    
    <div class="dotted-divider"></div>
    <div class="center bold" id="p-biz"></div>
    <div class="dotted-divider"></div>

    <div id="p-desc">ADA ZA TAKA :Tsh <span id="p-amt1"></span></div>
    <br>
    <div class="bold">JUMLA :Tsh <span id="p-amt2"></span></div>
    
    <div class="dotted-divider"></div>

    <div>JINA LA MLIPAJI :<span id="p-cust"></span></div>
    <div>ANUANI : MSAMVU, MOROGORO</div>
    <div>MPOKEAJI : <span id="p-biz2"></span></div>

    <div class="dotted-divider"></div>

    <div id="p-date" class="center"></div>
    <div class="center bold" style="margin-top: 5px; font-size: 10px;">
        HII NI STAKABADHI HALALI YA FEDHA ILIYOLIPWA
    </div>

    <div class="center" style="margin-top: 15px;">
        <svg id="barcode"></svg>
    </div>
</div>

<script>
function generateAndPrint() {
    // 1. Get Values
    const biz = document.getElementById('bizName').value;
    const cust = document.getElementById('custName').value;
    const amt = Number(document.getElementById('totalAmt').value).toFixed(2);
    const no = document.getElementById('rcptNo').value;
    const now = new Date();

    // 2. Fill Receipt
    document.getElementById('p-biz').innerText = biz;
    document.getElementById('p-biz2').innerText = biz;
    document.getElementById('p-cust').innerText = cust;
    document.getElementById('p-amt1').innerText = amt;
    document.getElementById('p-amt2').innerText = amt;
    document.getElementById('p-no').innerText = no;
    document.getElementById('p-date').innerText = "TAREHE " + now.toLocaleDateString('en-GB') + " " + now.toLocaleTimeString('en-GB');

    // 3. Generate Barcode (Requirement 3)
    JsBarcode("#barcode", no, {
        format: "CODE128",
        width: 1.5,
        height: 40,
        displayValue: false
    });

    // 4. Print
    setTimeout(() => { window.print(); }, 200);
}
</script>

</body>
</html>
